<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glassy app icon: a liquid-glass tile (colour wash like the app's artwork wallpaper)
       with a frosted glass lens in the middle and a white play mark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2493"/>
      <stop offset="0.42" stop-color="#7c3be0"/>
      <stop offset="0.78" stop-color="#f2589c"/>
      <stop offset="1" stop-color="#ffab68"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="playShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1c0b4d" flood-opacity=".42"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="212"/></clipPath>
    <clipPath id="lens"><circle cx="512" cy="512" r="300"/></clipPath>
    <!-- what sits behind the glass: the colour wash and its glowing blobs -->
    <g id="wash">
      <rect width="1024" height="1024" fill="url(#bg)"/>
      <circle cx="250" cy="220" r="320" fill="#56d2ff" opacity=".6" filter="url(#soft)"/>
      <circle cx="860" cy="870" r="300" fill="#ffd36a" opacity=".55" filter="url(#soft)"/>
      <circle cx="840" cy="230" r="230" fill="#ff78d6" opacity=".38" filter="url(#soft)"/>
      <circle cx="180" cy="860" r="240" fill="#4a2fd0" opacity=".5" filter="url(#soft)"/>
    </g>
    <linearGradient id="tileRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="lensRim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="lensShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#1a0b45" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0b45" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe8ff"/>
    </linearGradient>
  </defs>

  <!-- soft shadow under the tile -->
  <rect x="88" y="104" width="848" height="860" rx="200" fill="#160a3a" opacity=".38" filter="url(#tileShadow)"/>

  <!-- the tile -->
  <g clip-path="url(#tile)">
    <use xlink:href="#wash"/>
    <!-- a broad sheen across the top, like light on glass -->
    <path d="M64 64 H960 V380 C760 300 420 330 64 470 Z" fill="#fff" opacity=".09"/>
  </g>
  <rect x="66.5" y="66.5" width="891" height="891" rx="210" fill="none" stroke="url(#tileRim)" stroke-width="5"/>

  <!-- the glass lens: a frosted, slightly magnified view of the wash behind it -->
  <circle cx="512" cy="530" r="300" fill="#140838" opacity=".28" filter="url(#tileShadow)"/>
  <g clip-path="url(#lens)">
    <g filter="url(#frost)">
      <use xlink:href="#wash" transform="translate(512 512) scale(1.16) translate(-512 -512)"/>
    </g>
    <circle cx="512" cy="512" r="300" fill="url(#lensFill)"/>
    <circle cx="512" cy="512" r="300" fill="url(#lensShade)"/>
  </g>
  <circle cx="512" cy="512" r="297" fill="none" stroke="url(#lensRim)" stroke-width="7"/>
  <!-- specular arc top left -->
  <path d="M296 418 A232 232 0 0 1 452 288" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="16" stroke-linecap="round"/>

  <!-- play mark, nudged right so it looks centred -->
  <path d="M460 404 L640 512 L460 620 Z" fill="url(#play)" stroke="url(#play)" stroke-width="58" stroke-linejoin="round" filter="url(#playShadow)"/>
</svg>
