# Push a tag like v0.3.0 → GitHub builds Glass Player on Windows and publishes a Release.
# Installed copies of Glass see the new Release and update themselves (popup bottom right).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # castlabs Electron (Widevine, for Spotify inside Glass) downloads its binary here
      - run: node node_modules/electron/install.js
      # optional: VMP signing for Spotify playback, once castlabs EVS credentials are added as repo secrets
      - run: python -m pip install --upgrade castlabs-evs
      - run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
